<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movie download web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: radial-gradient(ellipse at top, #0a0212, #1a052a); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
        }
        .gradient-text { 
            background: linear-gradient(135deg, #a855f7, #ec4899); 
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent; 
        }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* Normal scrolling navbar - NOT fixed */
        nav {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <nav class="py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold gradient-text cursor-pointer" onclick="showPage('/')">Mystic Center Center</div>
            </div>
        </div>
    </nav>
    <div class="min-h-screen">
        <div id="page_home" class="page active">
            <div class="container mx-auto px-4 py-20 text-center">
                <h1 class="text-6xl font-bold gradient-text">Mystic Center Center</h1>
                <p class="text-gray-400 mt-4">Welcome to EagleCode</p>
            </div>
        </div>
    </div>
    <script>
        function showPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page_home')?.classList.add('active');
            window.history.pushState({}, '', p);
        }
    </script>
</body>
</html>
