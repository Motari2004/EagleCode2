<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
<style>
    /* ========== SUBTLE GRADIENT BACKGROUNDS (NOT TOO BRIGHT) ========== */
    
    /* Main body - Dark subtle mesh gradient */
    .gradient-mesh {
        background: 
            radial-gradient(circle at 20% 30%, rgba(88, 28, 135, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(219, 39, 119, 0.1) 0%, transparent 40%),
            linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 50%, #0a0a0f 100%);
        min-height: 100vh;
    }
    
    /* Subtle card gradient - dark and elegant */
    .gradient-card {
        background: linear-gradient(135deg, rgba(30, 27, 46, 0.8) 0%, rgba(20, 20, 35, 0.9) 100%);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(139, 92, 246, 0.15);
        transition: all 0.3s ease;
    }
    
    .gradient-card:hover {
        border-color: rgba(139, 92, 246, 0.3);
        background: linear-gradient(135deg, rgba(40, 35, 60, 0.9) 0%, rgba(30, 30, 45, 0.95) 100%);
        transform: translateY(-3px);
    }
    
    /* Subtle gradient text - not too flashy */
    .gradient-text {
        background: linear-gradient(135deg, #c084fc 0%, #e879f9 50%, #f472b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    
    /* Navbar - solid dark, no hover effects */
    nav {
        background: rgba(10, 10, 18, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(139, 92, 246, 0.15);
        position: relative;
        width: 100%;
        z-index: 100;
    }
    
    /* Nav links - simple, no hover effects */
    .nav-link {
        color: #a1a1aa;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        transition: none;
        cursor: pointer;
    }
    
    .nav-link.active {
        color: #c084fc;
    }
    
    /* Footer - solid dark, no hover effects */
    footer {
        background: rgba(10, 10, 18, 0.95);
        border-top: 1px solid rgba(139, 92, 246, 0.1);
        margin-top: 4rem;
        padding: 2rem 0;
    }
    
    /* Button gradient - subtle */
    .gradient-neon {
        background: linear-gradient(90deg, #7c3aed, #db2777);
        transition: opacity 0.2s ease;
    }
    
    .gradient-neon:hover {
        opacity: 0.9;
        transform: none;
        box-shadow: none;
    }
    
    /* Page transitions */
    .page {
        display: none;
        animation: fadeIn 0.25s ease;
    }
    
    .page.active {
        display: block;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Custom scrollbar - subtle */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    
    ::-webkit-scrollbar-track {
        background: #1a1a2e;
    }
    
    ::-webkit-scrollbar-thumb {
        background: #4c1d95;
        border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
        background: #6d28d9;
    }
    
    /* Selection color */
    ::selection {
        background: #7c3aed;
        color: white;
    }
    
    /* Smooth scroll */
    html {
        scroll-behavior: smooth;
    }
    
    /* Mobile menu */
    .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        padding: 0.5rem;
        background: transparent;
        border: none;
        z-index: 101;
    }
    
    .hamburger span {
        width: 24px;
        height: 2px;
        background: #a1a1aa;
        margin: 3px 0;
        transition: 0.3s;
        border-radius: 2px;
    }
    
    .mobile-menu {
        position: fixed;
        top: 0;
        right: -280px;
        width: 280px;
        height: 100vh;
        background: rgba(10, 10, 18, 0.98);
        backdrop-filter: blur(12px);
        border-left: 1px solid rgba(139, 92, 246, 0.15);
        z-index: 99;
        transition: right 0.3s ease;
        padding: 80px 24px 24px 24px;
    }
    
    .mobile-menu.active {
        right: 0;
    }
    
    .mobile-nav-link {
        display: block;
        padding: 12px 16px;
        color: #a1a1aa;
        text-decoration: none;
        border-radius: 0.5rem;
        cursor: pointer;
        margin-bottom: 8px;
    }
    
    .mobile-nav-link.active {
        color: #c084fc;
        background: rgba(124, 58, 237, 0.1);
    }
    
    .mobile-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 98;
        display: none;
    }
    
    .mobile-overlay.active {
        display: block;
    }
    
    @media (max-width: 768px) {
        .nav-links {
            display: none;
        }
        .hamburger {
            display: flex;
        }
    }
    
    .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.5rem;
    }
    
    @media (max-width: 640px) {
        .container {
            padding-left: 1rem;
            padding-right: 1rem;
        }
    }
</style>
