    <style>
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

            "expertise": `<h1 class="text-4xl font-bold mb-12 gradient-text">Our Expertise</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-8"><div class="p-8 rounded-2xl bg-zinc-900/50 border border-white/10"><h2 class="text-2xl font-bold mb-4">Frontend Mastery</h2><p class="text-gray-400">Expertise in React, Next.js, and Tailwind CSS to build pixel-perfect interfaces.</p></div><div class="p-8 rounded-2xl bg-zinc-900/50 border border-white/10"><h2 class="text-2xl font-bold mb-4">Backend Architecture</h2><p class="text-gray-400">Scalable server-side solutions using Node.js, PostgreSQL, and cloud infrastructure.</p></div></div>`,
