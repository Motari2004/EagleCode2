<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
<style>
    /* ========== ENHANCED GRADIENT BACKGROUNDS ========== */
    
    /* Primary gradient - Purple to Pink (Main theme) */
    .gradient-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        background-size: 200% 200%;
        animation: gradientShift 8s ease infinite;
    }
    
    /* Secondary gradient - Cyan to Purple */
    .gradient-secondary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #6B21A5 50%, #D946EF 75%, #F43F5E 100%);
        background-size: 300% 300%;
        animation: gradientShift 10s ease infinite;
    }
    
    /* Dark theme with purple-pink accents */
    .gradient-dark {
        background: radial-gradient(ellipse at 20% 30%, #1a0b2e 0%, #0a0212 50%, #1a052a 100%);
        position: relative;
    }
    
    .gradient-dark::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
        pointer-events: none;
    }
    
    /* Glassmorphism with gradient border */
    .gradient-glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
    }
    
    .gradient-glass::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
        border-radius: inherit;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: -1;
    }
    
    .gradient-glass:hover::before {
        opacity: 1;
    }
    
    /* Animated gradient text */
    .gradient-text {
        background: linear-gradient(135deg, #a855f7 0%, #d946ef 25%, #ec4899 50%, #f43f5e 75%, #a855f7 100%);
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s linear infinite;
    }
    
    /* Card gradient */
    .gradient-card {
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
    }
    
    .gradient-card:hover {
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
        border-color: rgba(168, 85, 247, 0.3);
        transform: translateY(-5px);
    }
    
    /* Hero gradient overlay */
    .gradient-overlay {
        background: linear-gradient(135deg, 
            rgba(10, 2, 18, 0.9) 0%,
            rgba(26, 5, 42, 0.7) 50%,
            rgba(168, 85, 247, 0.2) 100%);
    }
    
    /* Mesh gradient background */
    .gradient-mesh {
        background: 
            radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #0a0212 0%, #1a052a 100%);
    }
    
    /* Aurora gradient */
    .gradient-aurora {
        background: linear-gradient(125deg, 
            #0a0212 0%,
            #1a0b2e 20%,
            #2d1b4e 40%,
            #4c1d95 60%,
            #7e22ce 80%,
            #a855f7 100%);
        background-size: 200% 200%;
        animation: auroraShift 12s ease infinite;
    }
    
    /* Neon gradient for buttons */
    .gradient-neon {
        background: linear-gradient(90deg, #a855f7, #ec4899, #a855f7);
        background-size: 200% auto;
        animation: neonPulse 2s ease infinite;
        transition: all 0.3s ease;
    }
    
    .gradient-neon:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }
    
    /* Section divider gradient */
    .gradient-divider {
        background: linear-gradient(90deg, transparent, #a855f7, #ec4899, #a855f7, transparent);
        height: 2px;
        width: 100%;
    }
    
    /* Floating gradient orbs */
    .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        animation: float 8s ease-in-out infinite;
    }
    
    .gradient-orb-1 {
        background: radial-gradient(circle, #a855f7, transparent);
        width: 300px;
        height: 300px;
        top: -100px;
        left: -100px;
    }
    
    .gradient-orb-2 {
        background: radial-gradient(circle, #ec4899, transparent);
        width: 400px;
        height: 400px;
        bottom: -150px;
        right: -150px;
        animation-delay: -2s;
    }
    
    .gradient-orb-3 {
        background: radial-gradient(circle, #8b5cf6, transparent);
        width: 250px;
        height: 250px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: -4s;
    }
    
    /* Animations */
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    
    @keyframes auroraShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    @keyframes neonPulse {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    @keyframes float {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        33% { transform: translateY(-20px) translateX(10px); }
        66% { transform: translateY(10px) translateX(-10px); }
    }
    
    /* Smooth scroll behavior */
    html {
        scroll-behavior: smooth;
    }
    
    /* Custom scrollbar with gradient */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    
    ::-webkit-scrollbar-track {
        background: #1a052a;
    }
    
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #a855f7, #ec4899);
        border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #c084fc, #f472b6);
    }
    
    /* Selection color */
    ::selection {
        background: linear-gradient(135deg, #a855f7, #ec4899);
        color: white;
    }
</style>
<style>
        /* Gradient Mesh Background */
        .gradient-mesh {
            background: radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.15) 0%, rgba(139, 92, 246, 0.15) 30%, rgba(0, 0, 0, 0) 70%), radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, rgba(236, 72, 153, 0.15) 30%, rgba(0, 0, 0, 0) 70%);
            background-color: #0a0a0a; /* Fallback */
        }

        /* Gradient Aurora Background */
        .gradient-aurora {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(236, 72, 153, 0.3) 50%, rgba(0, 0, 0, 0) 100%);
            background-color: #0a0a0a; /* Fallback */
        }

        /* Gradient Card */
        .gradient-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gradient Neon Button */
        .gradient-neon {
            background: linear-gradient(90deg, #9333ea, #ec4899);
            box-shadow: 0 0 10px rgba(147, 51, 233, 0.5), 0 0 20px rgba(236, 72, 153, 0.5);
        }
        .gradient-neon:hover {
            background: linear-gradient(90deg, #a855f7, #f472b6);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.7), 0 0 30px rgba(244, 114, 182, 0.7);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(90deg, #9333ea, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Gradient Glass */
        .gradient-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Floating Orb */
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* Card Hover Effect */
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Mobile Menu */
        .mobile-menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .mobile-menu-backdrop.active {
            opacity: 1;
            visibility: visible;
        }
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -300px; /* Start off-screen */
            width: 300px;
            height: 100%;
            background-color: #1a1a1a; /* Dark background for menu */
            z-index: 50;
            transition: right 0.3s ease;
            padding-top: 60px; /* Space for potential fixed header */
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }
        .mobile-menu.active {
            right: 0; /* Slide in */
        }
        .mobile-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mobile-menu li {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mobile-menu li:last-child {
            border-bottom: none;
        }
        .mobile-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            display: block;
            transition: color 0.3s ease;
        }
        .mobile-menu a:hover {
            color: #ec4899;
        }

        /* Hamburger Icon */
        .hamburger-icon {
            display: none; /* Hidden by default */
            cursor: pointer;
            z-index: 60;
        }
        @media (max-width: 768px) {
            .hamburger-icon {
                display: block; /* Show on mobile */
            }
            .desktop-nav {
                display: none; /* Hide desktop nav */
            }
        }

        /* Animation for gradient text */
        .animate-gradient {
            animation: gradient-animation 3s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animation for floating elements */
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Specific icon components (placeholders) */
        .Speaker, .Play, .BookOpen, .GraduationCap, .Youtube, .Lightbulb, .Mail, .Phone, .MapPin, .Star {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
