    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0a0a; /* Very dark background */
            color: #e0e0e0;
            line-height: 1.6;
            overflow-x: hidden; /* Prevent horizontal scroll from transitions */
        }

        .gradient-text {
            background: linear-gradient(to right, #a78bfa, #f472b6); /* Purple-500 to Pink-400 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; /* Fallback for browsers that don't support -webkit-text-fill-color */
        }

        .glass {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Page transition styles */
        .page-content {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .page-content.fade-out {
            opacity: 0;
            transform: translateY(20px);
        }

        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #a78bfa, #f472b6);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #9373e6, #e05a9f);
        }

        /* Hamburger menu specific styles */
        .hamburger-menu {
            display: none; /* Hidden by default, shown on small screens */
            cursor: pointer;
            z-index: 50; /* Above other content */
        }

        .hamburger-menu span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: #e0e0e0;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .hamburger-menu.open span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger-menu.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-menu.open span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .mobile-nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }

        .mobile-nav-overlay.open {
            transform: translateX(0);
        }

        @media (max-width: 767px) {
            .hamburger-menu {
                display: block;
            }
            .desktop-nav {
                display: none;
            }
        }
    </style>
</head>

        };

        const contentDiv = document.getElementById('content');
        const hamburger = document.getElementById('hamburger');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
        const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');

        function loadContent(pageId) {
            const content = pageContents[pageId] || pageContents["page.tsx"]; // Default to page.tsx if invalid hash
            
            // Fade out current content
            contentDiv.classList.add('fade-out');

            setTimeout(() => {
                contentDiv.innerHTML = content;
                // Fade in new content
                contentDiv.classList.remove('fade-out');
                window.scrollTo(0, 0); // Scroll to top on new page load
            }, 500); // Match CSS transition duration
        }

        function handleHashChange() {
            const hash = window.location.hash.substring(1); // Remove '#'
            loadContent(hash || "page.tsx"); // Load page.tsx if no hash
        }

        // Event listeners for desktop navigation
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                if (link.classList.contains('mobile-nav-link')) return; // Handled by mobile links
                e.preventDefault();
                const targetPage = link.getAttribute('href').substring(1);
                window.location.hash = targetPage;
            });
        });

        // Hamburger menu toggle
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('open');
            mobileNavOverlay.classList.toggle('open');
        });

        // Close mobile nav when a link is clicked
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetPage = link.getAttribute('href').substring(1);
                window.location.hash = targetPage;
                hamburger.classList.remove('open');
                mobileNavOverlay.classList.remove('open');
            });
        });

        // Listen for hash changes
        window.addEventListener('hashchange', handleHashChange);

        // Initial load
        handleHashChange();
    </script>
