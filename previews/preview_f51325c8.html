                content = pageContents[contentKey];

            }
            appElement.innerHTML = content;
        }

        });

        // Simulate page transitions (basic example)
        appElement.style.transition = 'opacity 0.3s ease-in-out';
        let isFading = false;

        function fadeOut(callback) {
            if (isFading) return;
            isFading = true;
            appElement.style.opacity = '0';
            setTimeout(() => {
                callback();
                isFading = false;
            }, 300);
        }

        function fadeIn() {
            appElement.style.opacity = '1';
        }

        function renderPage(contentKey) {
            let content = '';
            if (contentKey === 'home' || contentKey === '/') {
                content = pageContents['home'];
            } else if (pageContents[contentKey]) {
                content = pageContents[contentKey];
            } else {
                content = '<div class="min-h-screen flex items-center justify-center text-4xl">Page Not Found</div>';
            }

            fadeOut(() => {
                appElement.innerHTML = content;
                fadeIn();
            });
        }

        // Re-apply initial render with fade effect
        fadeOut(() => {
            appElement.innerHTML = pageContents['home'];
            fadeIn();
        });

    </script>
</body>
</html>
