<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oak Workshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid-pattern { background-image: radial-gradient(circle, #ffffff 1px, transparent 1px); background-size: 40px 40px; }
        .card-hover:hover { transform: translateY(-10px); transition: all 0.3s ease; }
        .glow-hover:hover { box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <!-- Navigation -->
    <nav class="container mx-auto px-6 py-8 flex justify-between items-center">
        <a href="#" onclick="showPage('home')" class="text-2xl font-bold tracking-tighter">Oak Workshop</a>
        <div class="hidden md:flex space-x-8">
            <button onclick="showPage('projects')" class="hover:text-purple-400 transition">Projects</button>
            <button onclick="showPage('about')" class="hover:text-purple-400 transition">About</button>
            <button onclick="showPage('services')" class="hover:text-purple-400 transition">Services</button>
            <button onclick="showPage('contact')" class="hover:text-purple-400 transition">Contact</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="content">
        <div id="home" class="page-content">
            <div class="text-center py-20">
                <h1 class="text-6xl font-bold gradient-text">Oak Workshop</h1>
                <p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/10 mt-20">
        <div class="container mx-auto px-6 text-center text-gray-500">
            <p>&copy; 2024 Oak Workshop. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const pages = {
            home: `<div class="text-center py-20"><h1 class="text-6xl font-bold gradient-text">Oak Workshop</h1><p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p></div>`,
            projects: document.getElementById('projects')?.innerHTML || '<div class="p-20 text-center">Projects Content</div>',
            about: document.getElementById('about')?.innerHTML || '<div class="p-20 text-center">About Content</div>',
            services: document.getElementById('services')?.innerHTML || '<div class="p-20 text-center">Services Content</div>',
            contact: document.getElementById('contact')?.innerHTML || '<div class="p-20 text-center">Contact Content</div>'
        };

        function showPage(pageId) {
            const content = document.getElementById('content');
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerHTML = pages[pageId] || pages.home;
                content.style.opacity = 1;
            }, 200);
        }
    </script>

    <!-- Hidden Data Containers -->
    <div id="projects" class="hidden">
        <div class="bg-gradient-to-br from-purple-950 via-zinc-950 to-pink-950 text-white">
            <section class="relative py-24 text-center">
                <h1 class="text-6xl font-bold gradient-text mb-6">Our Creative Portfolio</h1>
                <p class="text-xl text-gray-300 mb-8">A showcase of our innovative work.</p>
            </section>
        </div>
    </div>

    <div id="about" class="hidden">
        <div class="bg-gradient-to-br from-purple-950 via-zinc-950 to-pink-950 text-white p-10">
            <h1 class="text-5xl font-bold gradient-text">About Oak Workshop</h1>
            <p class="mt-6 text-lg">Our journey in crafting exceptional digital experiences.</p>
        </div>
    </div>

    <div id="services" class="hidden">
        <div class="bg-gradient-to-br from-purple-950 via-zinc-950 to-pink-950 text-white p-10">
            <h1 class="text-5xl font-bold gradient-text">Our Comprehensive Services</h1>
        </div>
    </div>

    <div id="contact" class="hidden">
        <div class="bg-gradient-to-br from-purple-950 via-zinc-950 to-pink-950 text-white p-10">
            <h1 class="text-5xl font-bold gradient-text">Get in Touch</h1>
        </div>
    </div>

</body>
</html>
