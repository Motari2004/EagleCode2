<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #8b5cf6, #ec4899);
            animation: gradient 5s ease infinite;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .page-transition-enter-active,
        .page-transition-leave-active {
            transition: opacity 0.3s ease;
        }
        .page-transition-enter,
        .page-transition-leave-to {
            opacity: 0;
        }
        .scroll-container {
            overflow-y: auto;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <header class="bg-gray-900/80 backdrop-blur-sm py-4 sticky top-0 z-50">
        <nav class="container mx-auto px-4 flex items-center justify-between">
            <a href="/" class="text-3xl font-bold gradient-text">Serene University</a>
            <div class="hidden md:flex space-x-6">
                <a href="/courses" class="hover:text-purple-400 transition">Courses</a>
                <a href="/admissions" class="hover:text-purple-400 transition">Admissions</a>
                <a href="/faculty" class="hover:text-purple-400 transition">Faculty</a>
                <a href="/events" class="hover:text-purple-400 transition">Events</a>
                <a href="/visit" class="hover:text-purple-400 transition">Visit</a>
            </div>
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-gray-400 hover:text-white focus:outline-none">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
        </nav>
        <div id="mobile-menu" class="md:hidden hidden bg-gray-800/90 backdrop-blur-sm py-4">
            <div class="container mx-auto px-4 space-y-3">
                <a href="/courses" class="block py-2 px-4 hover:bg-purple-600 rounded-md">Courses</a>
                <a href="/admissions" class="block py-2 px-4 hover:bg-purple-600 rounded-md">Admissions</a>
                <a href="/faculty" class="block py-2 px-4 hover:bg-purple-600 rounded-md">Faculty</a>
                <a href="/events" class="block py-2 px-4 hover:bg-purple-600 rounded-md">Events</a>
                <a href="/visit" class="block py-2 px-4 hover:bg-purple-600 rounded-md">Visit</a>
            </div>
        </div>
    </header>

    <main id="app-content" class="flex-grow">
        <!-- Content will be loaded here -->
    </main>
