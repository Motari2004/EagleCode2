<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Pond University</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0a0a; /* zinc-950 */
            color: #e4e4e7; /* zinc-200 */
        }

        /* Custom Gradient Text */
        .gradient-text {
            background: linear-gradient(to right, #a855f7, #ec4899); /* purple-500 to pink-500 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; /* Fallback for browsers that don't support -webkit-text-fill-color */
        }

        /* Grid Pattern Background */
        .grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Glassmorphism Effect */
        .glass {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Hover Effects */
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 15px rgba(168, 85, 247, 0.5); /* purple-500 glow */
        }

        .glow-hover:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); /* Stronger purple glow */
        }

        /* Animations */
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        /* Page Transition (simple fade) */
        .page-transition-enter-active, .page-transition-leave-active {
            transition: opacity 0.5s ease;
        }
        .page-transition-enter, .page-transition-leave-to {
            opacity: 0;
        }

        /* Hamburger menu specific styles */
        .hamburger-menu {
            display: none;
        }
        @media (max-width: 767px) {
            .hamburger-menu {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #18181b; /* zinc-900 */
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 1rem;
            }
            .nav-links.active {
                display: flex;
            }
            .nav-links a {
                padding: 0.75rem 1rem;
                text-align: center;
            }
        }
    </style>
</head>

    <script>
        const appContent = document.getElementById('app-content');
        const navLinks = document.getElementById('nav-links');
        const hamburgerButton = document.getElementById('hamburger-button');
        const hamburgerIconOpen = document.getElementById('hamburger-icon-open');
        const hamburgerIconClose = document.getElementById('hamburger-icon-close');

        const pageTemplates = {
            home: document.getElementById('page-home'),
            listen: document.getElementById('page-listen'),
            artists: document.getElementById('page-artists'),
            events: document.getElementById('page-events'),
            about: document.getElementById('page-about'),
            contact: document.getElementById('page-contact'),
        };

        const footerTemplate = document.getElementById('footer-template');

        function renderPage(pageName) {
            const template = pageTemplates[pageName];
            if (template) {
                // Clear existing content with a fade-out effect
                appContent.classList.add('page-transition-leave-to');
                setTimeout(() => {
                    appContent.innerHTML = '';
                    const clonedContent = template.content.cloneNode(true);
                    appContent.appendChild(clonedContent);

                    // Append footer
                    const clonedFooter = footerTemplate.content.cloneNode(true);
                    appContent.appendChild(clonedFooter);

                    // Re-render Lucide icons
                    lucide.createIcons();

                    // Handle contact form submission
                    if (pageName === 'contact') {
                        const contactForm = document.getElementById('contact-form');
                        if (contactForm) {
                            contactForm.addEventListener('submit', function(event) {
                                event.preventDefault();
                                alert('Thank you for your message! We will get back to you shortly.');
                                contactForm.reset();
                            });
                        }
                    }

                    // Apply fade-in effect
                    appContent.classList.remove('page-transition-leave-to');
                    appContent.classList.add('page-transition-enter'); // Add for initial state
                    setTimeout(() => {
                        appContent.classList.remove('page-transition-enter'); // Remove to allow transition
                    }, 10); // Small delay to ensure class is applied before removal
                }, 300); // Match CSS transition duration
            } else {
                appContent.innerHTML = `<div class="text-center py-20"><h1 class="text-4xl font-bold text-red-500">404 - Page Not Found</h1><p class="text-gray-400 mt-4 text-lg">The page you are looking for does not exist.</p></div>`;
                const clonedFooter = footerTemplate.content.cloneNode(true);
                appContent.appendChild(clonedFooter);
                lucide.createIcons();
            }
            // Close hamburger menu if open
            navLinks.classList.remove('active');
            hamburgerIconOpen.classList.remove('hidden');
            hamburgerIconClose.classList.add('hidden');
        }

        function handleRouteChange() {
            const hash = window.location.hash.substring(1);
            const pageName = hash || 'home'; // Default to 'home'
            renderPage(pageName);
        }

        // Event Listeners
        window.addEventListener('hashchange', handleRouteChange);
        window.addEventListener('DOMContentLoaded', handleRouteChange);

        hamburgerButton.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            hamburgerIconOpen.classList.toggle('hidden');
            hamburgerIconClose.classList.toggle('hidden');
        });

        // Close hamburger menu when a nav link is clicked
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                    hamburgerIconOpen.classList.remove('hidden');
                    hamburgerIconClose.classList.add('hidden');
                }
            });
        });

        // Initial icon rendering
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
