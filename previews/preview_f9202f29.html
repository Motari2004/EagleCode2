<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanted Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-text {
            background: linear-gradient(to right, #c084fc, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-6 py-8">
        <!-- Navigation -->
        <nav class="flex justify-between items-center mb-16">
            <a href="#" onclick="loadPage('home')" class="text-2xl font-bold tracking-tighter">Enchanted Academy</a>
            <div class="hidden md:flex space-x-8">
                <a href="#" onclick="loadPage('courses')" class="hover:text-purple-400 transition">Courses</a>
                <a href="#" onclick="loadPage('admissions')" class="hover:text-purple-400 transition">Admissions</a>
                <a href="#" onclick="loadPage('faculty')" class="hover:text-purple-400 transition">Faculty</a>
                <a href="#" onclick="loadPage('events')" class="hover:text-purple-400 transition">Events</a>
                <a href="#" onclick="loadPage('contact')" class="hover:text-purple-400 transition">Contact</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="content">
            <div class="text-center py-20">
                <h1 class="text-6xl font-bold gradient-text">Enchanted Academy</h1>
                <p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p>
            </div>
        </main>
    </div>

    <script>
        const pages = {
            "home": `<div class="text-center py-20"><h1 class="text-6xl font-bold gradient-text">Enchanted Academy</h1><p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p></div>`,
            "page.tsx": `<section class="text-center mb-20">
                <h1 class="text-6xl font-bold gradient-text mb-6">Enchanted Academy</h1>
                <p class="text-xl text-gray-400 max-w-2xl mx-auto">Empowering the next generation of innovators through modern learning.</p>
            </section>
            <section class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-purple-500/50 transition-all">
                    <h3 class="text-2xl font-bold mb-4">Feature 1</h3>
                    <p class="text-gray-400">Innovative curriculum designed for the modern world.</p>
                </div>
                <div class="p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-purple-500/50 transition-all">
                    <h3 class="text-2xl font-bold mb-4">Feature 2</h3>
                    <p class="text-gray-400">Innovative curriculum designed for the modern world.</p>
                </div>
                <div class="p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-purple-500/50 transition-all">
                    <h3 class="text-2xl font-bold mb-4">Feature 3</h3>
                    <p class="text-gray-400">Innovative curriculum designed for the modern world.</p>
                </div>
            </section>`,
            "courses": `<h1 class="text-4xl font-bold mb-10">Our Courses</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="p-6 bg-white/5 rounded-xl border border-white/10"><h2 class="text-xl font-bold">Course Title 1</h2><p class="text-gray-400">Detailed description of the course curriculum.</p></div>
                <div class="p-6 bg-white/5 rounded-xl border border-white/10"><h2 class="text-xl font-bold">Course Title 2</h2><p class="text-gray-400">Detailed description of the course curriculum.</p></div>
                <div class="p-6 bg-white/5 rounded-xl border border-white/10"><h2 class="text-xl font-bold">Course Title 3</h2><p class="text-gray-400">Detailed description of the course curriculum.</p></div>
                <div class="p-6 bg-white/5 rounded-xl border border-white/10"><h2 class="text-xl font-bold">Course Title 4</h2><p class="text-gray-400">Detailed description of the course curriculum.</p></div>
            </div>`,
            "admissions": `<h1 class="text-4xl font-bold mb-10">Admissions</h1><div class="space-y-6"><p>Follow our simple 3-step application process.</p><button class="px-6 py-3 bg-purple-600 rounded-lg">Apply Now</button></div>`,
            "faculty": `<h1 class="text-4xl font-bold mb-10">Our Faculty</h1><div class="grid grid-cols-1 md:grid-cols-3 gap-8"><div class="p-6 bg-white/5 rounded-xl text-center"><div class="w-24 h-24 bg-purple-900 rounded-full mx-auto mb-4"></div><h3 class="font-bold">Professor 1</h3></div><div class="p-6 bg-white/5 rounded-xl text-center"><div class="w-24 h-24 bg-purple-900 rounded-full mx-auto mb-4"></div><h3 class="font-bold">Professor 2</h3></div><div class="p-6 bg-white/5 rounded-xl text-center"><div class="w-24 h-24 bg-purple-900 rounded-full mx-auto mb-4"></div><h3 class="font-bold">Professor 3</h3></div></div>`,
            "events": `<h1 class="text-4xl font-bold mb-10">Events Calendar</h1><div class="space-y-4"><div class="p-6 bg-white/5 rounded-xl flex justify-between"><span>Event Title 1</span><span>Date: 2024-12-</span></div><div class="p-6 bg-white/5 rounded-xl flex justify-between"><span>Event Title 2</span><span>Date: 2024-12-</span></div><div class="p-6 bg-white/5 rounded-xl flex justify-between"><span>Event Title 3</span><span>Date: 2024-12-</span></div></div>`,
            "contact": `<h1 class="text-4xl font-bold mb-10">Contact Us</h1><form class="max-w-lg space-y-4"><input type="text" placeholder="Name" class="w-full p-3 bg-white/5 rounded-lg" /><input type="email" placeholder="Email" class="w-full p-3 bg-white/5 rounded-lg" /><textarea placeholder="Message" class="w-full p-3 bg-white/5 rounded-lg h-32"></textarea><button class="px-6 py-3 bg-purple-600 rounded-lg">Send Message</button></form>`
        };

        function loadPage(page) {
            const content = document.getElementById('content');
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerHTML = pages[page] || pages['home'];
                content.style.opacity = 1;
            }, 200);
        }
    </script>
</body>
</html>
