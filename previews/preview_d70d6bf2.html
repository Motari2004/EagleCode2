            membership: `<h2 class="text-4xl font-bold mb-10">Membership Plans</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-8"><div class="p-8 bg-zinc-900 border border-orange-500 rounded-xl"><h3>Basic</h3><p>$49/mo</p></div><div class="p-8 bg-zinc-900 border border-orange-500 rounded-xl"><h3>Pro</h3><p>$89/mo</p></div><div class="p-8 bg-zinc-900 border border-orange-500 rounded-xl"><h3>Elite</h3><p>$129/mo</p></div></div>`,
            calculator: `<h2 class="text-4xl font-bold mb-10">BMI Calculator</h2><div class="max-w-md p-8 bg-zinc-900 rounded-xl"><input id="weight" type="number" placeholder="Weight (kg)" class="w-full p-2 mb-4 bg-black rounded text-white"><input id="height" type="number" placeholder="Height (cm)" class="w-full p-2 mb-4 bg-black rounded text-white"><button onclick="calculateBMI()" class="bg-orange-500 px-6 py-2 rounded w-full">Calculate</button><p id="result" class="mt-4 text-xl"></p></div>`
        };

        function render(page) {
            document.getElementById('content').innerHTML = pages[page] || pages.home;
        }

        function calculateBMI() {
            const w = document.getElementById('weight').value;
            const h = document.getElementById('height').value / 100;
            const bmi = (w / (h * h)).toFixed(1);
            document.getElementById('result').innerText = "Your BMI is: " + bmi;
        }
    </script>
