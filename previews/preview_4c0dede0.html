        const contentDiv = document.getElementById('content');
        const hamburgerButton = document.getElementById('hamburger-button');
        const mobileNavMenu = document.getElementById('mobile-nav-menu');

        function loadPage(pageId) {
            if (!pageContents[pageId]) {
                console.error('Page not found:', pageId);
                // Fallback to home if page not found
                pageId = 'home';
            }

            // Hide current content for transition
            contentDiv.classList.remove('content-visible');
            contentDiv.classList.add('content-hidden');

            setTimeout(() => {
                contentDiv.innerHTML = pageContents[pageId];
                // Show new content
                contentDiv.classList.remove('content-hidden');
                contentDiv.classList.add('content-visible');
                window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top on new page load
            }, 300); // Match transition duration
            
            // Close mobile menu if open
            if (!mobileNavMenu.classList.contains('hidden')) {
                mobileNavMenu.classList.add('hidden');
            }
        }

        function navigate(pageId) {
            history.pushState({ page: pageId }, '', `#${pageId}`);
            loadPage(pageId);
        }

        // Handle initial load and hash changes
        window.addEventListener('DOMContentLoaded', () => {
            const initialPage = window.location.hash.substring(1) || 'home';
            loadPage(initialPage);
        });

        window.addEventListener('popstate', (event) => {
            const pageId = event.state ? event.state.page : (window.location.hash.substring(1) || 'home');
            loadPage(pageId);
        });

        // Hamburger menu toggle
        hamburgerButton.addEventListener('click', () => {
            mobileNavMenu.classList.toggle('hidden');
        });

        // Close mobile menu when a link is clicked
        mobileNavMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileNavMenu.classList.add('hidden');
            });
        });
    </script>
