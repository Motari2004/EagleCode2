<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Atelier Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-text { background: linear-gradient(to right, #c084fc, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid-pattern { background-image: radial-gradient(#4f46e5 0.5px, transparent 0.5px); background-size: 20px 20px; }
        .card-hover:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .glow-hover:hover { box-shadow: 0 0 20px rgba(192, 132, 252, 0.2); }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans">

    <!-- Navigation -->
    <nav class="container mx-auto px-6 py-8 flex justify-between items-center">
        <a href="#" onclick="render('home')" class="text-2xl font-bold tracking-tighter">House Atelier Learning</a>
        <div class="hidden md:flex space-x-8">
            <a href="#" onclick="render('features')" class="hover:text-purple-400 transition">Features</a>
            <a href="#" onclick="render('pricing')" class="hover:text-purple-400 transition">Pricing</a>
            <a href="#" onclick="render('solutions')" class="hover:text-purple-400 transition">Solutions</a>
            <a href="#" onclick="render('integrations')" class="hover:text-purple-400 transition">Integrations</a>
            <a href="#" onclick="render('contact')" class="hover:text-purple-400 transition">Contact</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app">
        <div class="text-center py-20"><h1 class="text-6xl font-bold gradient-text">House Atelier Learning</h1><p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p></div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-zinc-800 mt-20">
        <div class="container mx-auto px-6 text-center text-gray-500">
            <p>&copy; 2024 House Atelier Learning. All rights reserved.</p>
            <div class="mt-4 space-x-4">
                <a href="#" class="hover:text-white">Privacy</a>
                <a href="#" class="hover:text-white">Terms</a>
            </div>
        </div>
    </footer>

    <script>
        const content = {
            "home": `<div class="text-center py-20"><h1 class="text-6xl font-bold gradient-text">House Atelier Learning</h1><p class="text-gray-400 mt-4 text-lg">Welcome to our digital space.</p></div>`,
            "features": document.createElement('div').innerHTML = `Features Page Content Placeholder`,
            "pricing": document.createElement('div').innerHTML = `Pricing Page Content Placeholder`,
            "solutions": document.createElement('div').innerHTML = `Solutions Page Content Placeholder`,
            "integrations": document.createElement('div').innerHTML = `Integrations Page Content Placeholder`,
            "contact": document.createElement('div').innerHTML = `Contact Page Content Placeholder`
        };

        function render(page) {
            const app = document.getElementById('app');
            if (page === 'home') {
                app.innerHTML = content.home;
            } else {
                // In a real app, this would fetch the specific component content
                app.innerHTML = `<div class="p-20 text-center"><h2 class="text-4xl font-bold capitalize">${page}</h2><p class="mt-4">Content for ${page} section.</p></div>`;
            }
        }
    </script>
</body>
</html>
