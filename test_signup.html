<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 500px; width: 90%; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div id="dbModal" class="modal">
        <div class="modal-content bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-6 border border-purple-500/30 shadow-2xl">
            <div class="text-center mb-4">
                <div class="w-16 h-16 rounded-full bg-purple-500/20 flex items-center justify-center mx-auto mb-3">
                    <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold">Database Connection Required</h2>
                <p class="text-gray-400 text-sm mt-2">Please enter your Neon PostgreSQL connection string</p>
            </div>
            <div class="mb-4">
                <label class="block text-sm mb-2">Connection String</label>
                <input type="text" id="dbConnectionString" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-purple-500 text-sm font-mono" 
                       placeholder="postgresql://username:password@ep-example.neon.tech/dbname?sslmode=require">
            </div>
            <div class="flex gap-3">
                <button id="saveDbBtn" class="flex-1 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 font-semibold transition">Save & Continue</button>
                <button id="cancelDbBtn" class="flex-1 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-semibold transition">Cancel</button>
            </div>
            <div id="dbMessage" class="mt-3 text-center text-sm hidden"></div>
        </div>
    </div>

    <div class="max-w-md w-full bg-gray-800 rounded-xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center">Test Signup</h1>
        <form id="signupForm" class="space-y-4">
            <div><input type="text" id="name" placeholder="Name" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-purple-500"></div>
            <div><input type="email" id="email" required placeholder="Email" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-purple-500"></div>
            <div><input type="password" id="password" required placeholder="Password" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-purple-500"></div>
            <div><input type="password" id="confirmPassword" required placeholder="Confirm Password" class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-purple-500"></div>
            <button type="submit" class="w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 font-semibold transition">Sign Up</button>
        </form>
        <div id="message" class="mt-4 text-center text-sm hidden"></div>
        <p class="mt-4 text-center text-gray-400 text-sm">Backend: <span id="backendStatus" class="text-yellow-400">Checking...</span></p>
    </div>

    <script>
        const BACKEND_URL = "http://localhost:8000";
        let connectionId = localStorage.getItem("connection_id");
        
        async function saveDatabaseConnection(connectionString) {
            const messageDiv = document.getElementById('dbMessage');
            messageDiv.innerHTML = '<span class="text-yellow-400">⏳ Configuring...</span>';
            messageDiv.classList.remove('hidden');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/store-db-connection`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ db_connection_string: connectionString })
                });
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem("connection_id", data.connection_id);
                    connectionId = data.connection_id;
                    messageDiv.innerHTML = '<span class="text-green-400">✅ Database configured!</span>';
                    setTimeout(() => {
                        document.getElementById('dbModal').classList.remove('active');
                        messageDiv.classList.add('hidden');
                    }, 1500);
                    return true;
                } else {
                    messageDiv.innerHTML = '<span class="text-red-400">❌ ' + (data.error || 'Failed') + '</span>';
                    return false;
                }
            } catch (error) {
                messageDiv.innerHTML = '<span class="text-red-400">❌ Network error</span>';
                return false;
            }
        }
        
        async function checkBackend() {
            const statusSpan = document.getElementById('backendStatus');
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                if (response.ok) {
                    statusSpan.innerHTML = '✅ Connected';
                    statusSpan.className = 'text-green-400';
                }
            } catch (error) {
                statusSpan.innerHTML = '❌ Not reachable';
                statusSpan.className = 'text-red-400';
            }
        }
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<span class="text-red-400">❌ Passwords do not match</span>';
                messageDiv.classList.remove('hidden');
                return;
            }
            
            messageDiv.innerHTML = '<span class="text-yellow-400">⏳ Creating account...</span>';
            messageDiv.classList.remove('hidden');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, connection_id: connectionId })
                });
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = '<span class="text-green-400">✅ Account created successfully!</span>';
                    document.getElementById('signupForm').reset();
                } else if (data.requires_db) {
                    messageDiv.classList.add('hidden');
                    document.getElementById('dbModal').classList.add('active');
                } else {
                    messageDiv.innerHTML = '<span class="text-red-400">❌ ' + (data.error || 'Signup failed') + '</span>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<span class="text-red-400">❌ Network error</span>';
            }
        });
        
        document.getElementById('saveDbBtn').addEventListener('click', async () => {
            const connStr = document.getElementById('dbConnectionString').value.trim();
            if (!connStr) {
                document.getElementById('dbMessage').innerHTML = '<span class="text-red-400">❌ Enter connection string</span>';
                document.getElementById('dbMessage').classList.remove('hidden');
                return;
            }
            await saveDatabaseConnection(connStr);
        });
        
        document.getElementById('cancelDbBtn').addEventListener('click', () => {
            document.getElementById('dbModal').classList.remove('active');
        });
        
        checkBackend();
        if (!connectionId) {
            setTimeout(() => document.getElementById('dbModal').classList.add('active'), 500);
        }
    </script>
</body>
</html>
